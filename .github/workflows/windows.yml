name: Windows build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Validate assets
        run: python tools/validate_project.py
      - name: Get dependency manager
        run: |
          git clone --branch 2025.06.13 --depth 1 https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP/vcpkg"
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          New-Item "$env:RUNNER_TEMP/vcpkg-cache" -ItemType Directory -Force
          "VCPKG_DEFAULT_BINARY_CACHE=$env:RUNNER_TEMP/vcpkg-cache" >> $env:GITHUB_ENV
      - uses: actions/cache/restore@v4
        id: dependency-cache
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-20250613-x64-static-release-${{ hashFiles('vcpkg.json', 'triplets/*') }}
      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DVCPKG_OVERLAY_TRIPLETS="${{ github.workspace }}/triplets" -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
      - uses: actions/cache/save@v4
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-20250613-x64-static-release-${{ hashFiles('vcpkg.json', 'triplets/*') }}
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test engine
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Test native window
        shell: pwsh
        run: |
          $process = Start-Process build/Release/Torrent.exe -ArgumentList '--smoke-test' -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            if (Test-Path Torrent-startup-stages.txt) { Get-Content Torrent-startup-stages.txt }
            throw "Native startup or shutdown timed out"
          }
          if (Test-Path Torrent-startup-stages.txt) { Get-Content Torrent-startup-stages.txt }
          if ($process.ExitCode -ne 0) {
            if (Test-Path Torrent-startup-error.txt) { Get-Content Torrent-startup-error.txt }
            throw "Application exited with error"
          }
      - name: Stage and check size
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix dist/app
          New-Item dist/app/licenses -ItemType Directory -Force
          Get-ChildItem build/vcpkg_installed/x64-windows-static/share -Filter copyright -Recurse | ForEach-Object { Copy-Item $_.FullName ("dist/app/licenses/" + $_.Directory.Name + ".txt") }
          $size = (Get-ChildItem dist/app -File -Recurse | Measure-Object Length -Sum).Sum
          "Installed payload bytes: $size" | Tee-Object -FilePath dist/size.txt
          if ($size -gt 50MB) { throw "Installed payload exceeds 50 MiB budget" }
      - name: Build installer
        run: |
          choco install nsis --no-progress -y
          Push-Location installer
          & "${env:ProgramFiles(x86)}/NSIS/makensis.exe" /WX /INPUTCHARSET UTF8 Torrent.nsi
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
          Pop-Location
      - name: Build visual setup shell
        run: |
          cmake -S . -B build -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DVCPKG_OVERLAY_TRIPLETS="${{ github.workspace }}/triplets" -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build build --config Release --target TorrentSetup --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Setup shell build failed" }
          Copy-Item build/Release/Torrent-Setup.exe dist/Torrent-Setup.exe
          Remove-Item dist/Torrent-Payload.exe
      - name: Capture actual UI screens
        shell: pwsh
        run: |
          New-Item dist/screenshots -ItemType Directory -Force
          $app = (Resolve-Path build/Release/Torrent.exe).Path
          $setup = (Resolve-Path dist/Torrent-Setup.exe).Path
          Push-Location dist/screenshots
          foreach ($exe in @($app, $setup)) {
            $process = Start-Process $exe -ArgumentList '--visual-test' -PassThru -WindowStyle Hidden
            if (-not $process.WaitForExit(30000)) { $process.Kill(); throw "Visual capture timed out" }
            if ($process.ExitCode -ne 0) { throw "Visual capture failed" }
          }
          if ((Get-ChildItem *.png).Count -ne 6) { throw "Missing visual screenshots" }
          Pop-Location
      - name: Test immediate settings and styled menus
        shell: pwsh
        run: |
          $folder = (Resolve-Path dist/screenshots).Path
          python -c "import hashlib,pathlib; data=b'T'*16384; info=b'd6:lengthi16384e4:name21:Before file selection12:piece lengthi16384e6:pieces20:'+hashlib.sha1(data).digest()+b'e';pathlib.Path('dist/screenshots/pending.torrent').write_bytes(b'd4:info'+info+b'e')"
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/test_ui.ps1 -Executable build/Release/Torrent.exe -WorkingFolder $folder
          if ($LASTEXITCODE -ne 0) { throw "UI interaction test failed" }
      - name: Capture dark theme with embedded font
        shell: pwsh
        run: |
          New-Item dist/screenshots/dark -ItemType Directory -Force
          $app = (Resolve-Path build/Release/Torrent.exe).Path
          $setup = (Resolve-Path dist/Torrent-Setup.exe).Path
          Push-Location dist/screenshots/dark
          foreach ($exe in @($app, $setup)) {
            $process = Start-Process $exe -ArgumentList '--visual-test-dark' -PassThru -WindowStyle Hidden
            if (-not $process.WaitForExit(30000)) { $process.Kill(); throw "Dark capture timed out" }
            if ($process.ExitCode -ne 0) { throw "Dark capture failed" }
          }
          if ((Get-ChildItem *.png).Count -ne 6) { throw "Missing dark screenshots" }
          Pop-Location
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Torrent-Windows-x64
          path: dist/
