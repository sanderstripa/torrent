name: Windows build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    if: github.ref != 'refs/heads/rust-edition'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: false
      - name: Validate assets
        run: |
          python tools/validate_project.py
          python tools/check_ui_contract.py
          python tools/check_installer_reference.py
          python tools/compile_settings_icon.py --check
          python tools/compile_theme_icons.py --check
      - name: Get dependency manager
        run: |
          git clone --branch 2025.06.13 --depth 1 https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP/vcpkg"
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          New-Item "$env:RUNNER_TEMP/vcpkg-cache" -ItemType Directory -Force
          "VCPKG_DEFAULT_BINARY_CACHE=$env:RUNNER_TEMP/vcpkg-cache" >> $env:GITHUB_ENV
      - uses: actions/cache/restore@v4
        id: dependency-cache
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-20250613-x64-static-release-${{ hashFiles('vcpkg.json', 'triplets/*') }}
      - name: Select Rust Edition
        if: github.ref == 'refs/heads/rust-edition'
        run: |
          rustup target add x86_64-pc-windows-msvc
          if ($LASTEXITCODE) { throw "Rust toolchain setup failed" }
          "TORRENT_RE=ON" >> $env:GITHUB_ENV
      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DVCPKG_OVERLAY_TRIPLETS="${{ github.workspace }}/triplets" -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded "-DTORRENT_RUST_EDITION=$env:TORRENT_RE"
      - uses: actions/cache/save@v4
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-20250613-x64-static-release-${{ hashFiles('vcpkg.json', 'triplets/*') }}
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test engine
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Compare Rust and C++ on Windows
        if: github.ref == 'refs/heads/rust-edition'
        run: |
          New-Item dist -ItemType Directory -Force | Out-Null
          ./build/Release/torrent_re_probe.exe bench asc | Tee-Object dist/re-sort-comparison.txt
          if ($LASTEXITCODE) { throw "Rust/C++ comparison failed" }
      - name: Test native window
        shell: pwsh
        run: |
          $process = Start-Process build/Release/Torrent.exe -ArgumentList '--smoke-test' -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            if (Test-Path Torrent-startup-stages.txt) { Get-Content Torrent-startup-stages.txt }
            throw "Native startup or shutdown timed out"
          }
          if (Test-Path Torrent-startup-stages.txt) { Get-Content Torrent-startup-stages.txt }
          if ($process.ExitCode -ne 0) {
            if (Test-Path Torrent-startup-error.txt) { Get-Content Torrent-startup-error.txt }
            throw "Application exited with error"
          }
      - name: Test window position persistence
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/test_window_position.ps1 -Executable build/Release/Torrent.exe -WorkingFolder dist/position-check
          if ($LASTEXITCODE -ne 0) { throw "Window position test failed" }
      - name: Stage and check size
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix dist/app
          New-Item dist/app/licenses -ItemType Directory -Force
          Get-ChildItem build/vcpkg_installed/x64-windows-static/share -Filter copyright -Recurse | ForEach-Object { Copy-Item $_.FullName ("dist/app/licenses/" + $_.Directory.Name + ".txt") }
          $size = (Get-ChildItem dist/app -File -Recurse | Measure-Object Length -Sum).Sum
          "Installed payload bytes: $size" | Tee-Object -FilePath dist/size.txt
          if ($size -gt 50MB) { throw "Installed payload exceeds 50 MiB budget" }
      - name: Build installer
        if: github.ref != 'refs/heads/rust-edition'
        run: |
          choco install nsis --no-progress -y
          Push-Location installer
          & "${env:ProgramFiles(x86)}/NSIS/makensis.exe" /WX /INPUTCHARSET UTF8 Torrent.nsi
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
          Pop-Location
      - name: Set versioned installer filename
        if: github.ref != 'refs/heads/rust-edition'
        shell: pwsh
        run: |
          $project = Get-Content CMakeLists.txt -Raw
          if ($project -notmatch 'project\(Torrent VERSION ([0-9]+\.[0-9]+\.[0-9]+)') { throw "Missing product version" }
          "TORRENT_VERSION=$($Matches[1])" >> $env:GITHUB_ENV
          "TORRENT_INSTALLER=Torrent-$($Matches[1])-Release-x64.exe" >> $env:GITHUB_ENV
      - name: Build shared CONNECT Installer
        if: github.ref != 'refs/heads/rust-edition'
        run: |
          ./scripts/build-connect-installer.ps1 -PayloadPath "$PWD/dist/Torrent-Payload.exe" -ExpectedExecutable "$PWD/dist/app/Torrent.exe" -Version $env:TORRENT_VERSION -OutFile "$PWD/dist/$env:TORRENT_INSTALLER" -TestUI
          powershell -NoProfile -ExecutionPolicy Bypass -Command "& ./tools/test_icon_resources.ps1 -Executables @('dist/app/Torrent.exe','dist/$env:TORRENT_INSTALLER','dist/Torrent-Payload.exe')"
          if ($LASTEXITCODE) { throw "Product icon resource audit failed" }
          Remove-Item -LiteralPath dist/Torrent-Payload.exe
          Compress-Archive -Path dist/app,"dist/$env:TORRENT_INSTALLER",dist/size.txt -DestinationPath dist/Torrent-Windows-x64.zip -Force
      - name: Capture actual UI screens
        shell: pwsh
        run: |
          New-Item dist/screenshots -ItemType Directory -Force
          $app = (Resolve-Path build/Release/Torrent.exe).Path
          Push-Location dist/screenshots
          foreach ($exe in @($app)) {
            $process = Start-Process $exe -ArgumentList '--visual-test' -PassThru -WindowStyle Hidden
            if (-not $process.WaitForExit(30000)) { $process.Kill(); throw "Visual capture timed out" }
            if ($process.ExitCode -ne 0) { throw "Visual capture failed" }
          }
          if ((Get-ChildItem *.png).Count -ne 3) { throw "Missing visual screenshots" }
          Pop-Location
      - name: Test immediate settings and styled menus
        shell: pwsh
        run: |
          $folder = (Resolve-Path dist/screenshots).Path
          python -c "import hashlib,pathlib; data=b'T'*16384; info=b'd6:lengthi16384e4:name21:Before file selection12:piece lengthi16384e6:pieces20:'+hashlib.sha1(data).digest()+b'e';pathlib.Path('dist/screenshots/pending.torrent').write_bytes(b'd4:info'+info+b'e')"
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/test_ui.ps1 -Executable build/Release/Torrent.exe -WorkingFolder $folder
          if ($LASTEXITCODE -ne 0) { throw "UI interaction test failed" }
      - name: Capture dark theme with embedded font
        shell: pwsh
        run: |
          New-Item dist/screenshots/dark -ItemType Directory -Force
          $app = (Resolve-Path build/Release/Torrent.exe).Path
          Push-Location dist/screenshots/dark
          foreach ($exe in @($app)) {
            $process = Start-Process $exe -ArgumentList '--visual-test-dark' -PassThru -WindowStyle Hidden
            if (-not $process.WaitForExit(30000)) { $process.Kill(); throw "Dark capture timed out" }
            if ($process.ExitCode -ne 0) { throw "Dark capture failed" }
          }
          if ((Get-ChildItem *.png).Count -ne 3) { throw "Missing dark screenshots" }
          Pop-Location
      - name: Compare baseline and Rust Edition executables
        if: github.ref == 'refs/heads/rust-edition'
        shell: pwsh
        run: |
          cmake -S . -B build -DTORRENT_RUST_EDITION=OFF
          if ($LASTEXITCODE) { throw 'Baseline configuration failed' }
          cmake --build build --config Release --parallel 2 --target Torrent
          if ($LASTEXITCODE) { throw 'Baseline build failed' }
          ./rust-edition/compare-windows.ps1 -Baseline build/Release/Torrent.exe -Preview dist/app/Torrent.exe |
            Tee-Object -Append dist/re-sort-comparison.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Torrent-Windows-x64
          path: dist/
      - name: Publish verified 1.4.0 installer icon
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.4.0 *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Refusing to overwrite an existing release' }
          $files = @('dist/Torrent-1.4.0-Release-x64.exe','dist/Torrent-Windows-x64.zip')
          $sums = foreach ($file in $files) { "$((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($file))" }
          $sums | Set-Content -LiteralPath SHA256SUMS.txt -Encoding ascii
          gh release create v1.4.0 dist/Torrent-1.4.0-Release-x64.exe dist/Torrent-Windows-x64.zip SHA256SUMS.txt --target $env:GITHUB_SHA --latest --title 'Torrent v1.4.0' --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Verified release publication failed' }
  rust-port-tests:
    if: github.ref == 'refs/heads/rust-edition'
    permissions:
      contents: read
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Check and test Rust modules
        run: |
          cargo fmt --manifest-path rust-edition/Cargo.toml -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --target x86_64-pc-windows-msvc --features vpn --manifest-path rust-edition/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo check --locked --target x86_64-pc-windows-msvc --features installer --manifest-path rust-edition/Cargo.toml --bin torrent-re-setup
      - name: Exercise the pinned VPN cores through the Rust helper
        shell: pwsh
        run: |
          $env:TORRENT_VPN_FIXTURE_BIN = Join-Path $env:RUNNER_TEMP 'torrent-re-vpn'
          ./rust-edition/vpn/prepare.ps1 -Destination $env:TORRENT_VPN_FIXTURE_BIN
          cargo test --locked --target x86_64-pc-windows-msvc --features vpn --manifest-path rust-edition/Cargo.toml --test vpn-cores -- --ignored
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
  rust-librqbit-windows:
    if: github.ref == 'refs/heads/rust-edition'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ikatson/rqbit
          ref: d525e433f2ccde9d837e68eddd190be4275a2fa7
          path: .rqbit
          persist-credentials: false
      - name: Apply and verify Torrent's librqbit patch
        shell: pwsh
        run: |
          git -C .rqbit apply "$PWD/rust-edition/librqbit/torrent.patch"
          if ($LASTEXITCODE) { throw "librqbit patch failed to apply" }
          cargo test --manifest-path .rqbit/Cargo.toml --locked -p librqbit --no-default-features --features rust-tls --lib
          if ($LASTEXITCODE) { throw "librqbit session tests failed" }
  rust-rqbit-client-windows:
    if: github.ref == 'refs/heads/rust-edition'
    permissions:
      contents: read
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Test and build the Windows client against librqbit
        run: |
          cargo test --locked --target x86_64-pc-windows-msvc --features rqbit,vpn --manifest-path rust-edition/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked --target x86_64-pc-windows-msvc --features rqbit,vpn --manifest-path rust-edition/Cargo.toml --bin torrent-re-windows
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Exercise the client window with librqbit
        shell: pwsh
        run: |
          ./rust-edition/tests/windows-ui.ps1 -Executable "$PWD/rust-edition/target/x86_64-pc-windows-msvc/debug/torrent-re-windows.exe" -NativeSettings
      - name: Build the optimized Rust client
        run: |
          cargo build --locked --target x86_64-pc-windows-msvc --release --features rqbit,vpn --manifest-path rust-edition/Cargo.toml --bin torrent-re-windows
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Exercise the native Rust installer and stage the CI build
        shell: pwsh
        run: |
          ./rust-edition/installer/check-native-package.ps1 -Executable "$PWD/rust-edition/target/x86_64-pc-windows-msvc/release/torrent-re-windows.exe" -ArtifactDirectory "$PWD/rust-edition-ci"
      - uses: actions/upload-artifact@v4
        with:
          name: Torrent-Rust-Edition-Windows-x64-CI
          path: |
            rust-edition-ci/*.exe
            rust-edition-ci/*.zip
            rust-edition-ci/SHA256SUMS.txt
          if-no-files-found: error
      - name: Compare Rust screenshots with the published 1.4.4 Windows build
        shell: pwsh
        run: |
          ./rust-edition/tests/compare-native-visuals.ps1 -Executable "$PWD/rust-edition/target/x86_64-pc-windows-msvc/release/torrent-re-windows.exe" -Output "$PWD/rust-edition-ci/visual-comparison" -Installer "$PWD/rust-edition-ci/Torrent-RE-Setup-Windows-x64.exe"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: Torrent-1.4.4-Windows-Visual-Comparison
          path: rust-edition-ci/visual-comparison/
          if-no-files-found: error
