[package]
name = "torrent_re_sort"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "rlib"]

[profile.release]
panic = "abort"

[features]
windows-app = []
installer = ["dep:tempfile", "dep:windows", "dep:windows-numerics"]
libtorrent = ["windows-app"]
rqbit = ["windows-app", "dep:windows", "dep:windows-numerics", "dep:bencode", "dep:librqbit", "dep:tokio", "dep:serde", "dep:serde_json", "dep:tempfile", "dep:url"]
vpn = ["dep:base64", "dep:hex", "dep:percent-encoding", "dep:serde_json", "dep:sha2", "dep:tempfile", "dep:url"]

[dependencies]
bencode = { package = "librqbit-bencode", path = "librqbit/vendor/crates/bencode", optional = true }
librqbit = { path = "librqbit/vendor/crates/librqbit", default-features = false, features = ["rust-tls"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "time"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
base64 = { version = "0.22", optional = true }
hex = { version = "0.4", optional = true }
percent-encoding = { version = "2", optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
tempfile = { version = "3", optional = true }
url = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
] }
windows-numerics = { version = "0.3", optional = true }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Storage_Xps",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_SystemServices",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_Globalization",
] }

[[bin]]
name = "torrent-re-windows"
path = "src/main.rs"
required-features = ["windows-app"]

[[bin]]
name = "TorrentVpnHost"
path = "src/vpn/main.rs"
required-features = ["vpn"]

[[bin]]
name = "torrent-re-setup"
path = "src/installer_main.rs"
required-features = ["installer"]
